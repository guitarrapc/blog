<!-- アラート記法のJavaScriptコード -->
<script>
  // このスクリプトは記事内の引用に書いたGitHubのアラート記法(> [!NOTE] など)をアラート表示に変換します
  (function () {
    'use strict';

    // Alert types and their titles
    const ALERT_TITLES = {
      note: 'Note',
      tip: 'Tip',
      important: 'Important',
      warning: 'Warning',
      caution: 'Caution',
    };

    // Marker must be alone on its line: "[!NOTE]" followed by newline, <br> or end of paragraph.
    // Only spaces and tabs are allowed around it, same as GitHub (not full-width space or &nbsp;),
    // and it must be on the first line of the paragraph (no newline before it)
    const MARKER_PATTERN = /^[ \t]*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\][ \t]*(\r?\n|$)/i;

    // Blockquotes already handled while the page was loading
    const processed = new WeakSet();

    // Returns marker info if the element is a paragraph starting with an alert marker
    function findMarker(element) {
      if (element.tagName !== 'P') {
        return null;
      }

      const markerNode = element.firstChild;
      if (!markerNode || markerNode.nodeType !== Node.TEXT_NODE) {
        return null;
      }

      const match = markerNode.nodeValue.match(MARKER_PATTERN);
      if (!match) {
        return null;
      }

      // "[!NOTE]" ends at the text node boundary: next must be <br> or nothing (e.g. not "[!NOTE]<strong>")
      const lineBreak = match[2] ? null : markerNode.nextSibling;
      if (lineBreak && lineBreak.nodeName !== 'BR') {
        return null;
      }

      return { paragraph: element, markerNode: markerNode, lineBreak: lineBreak, match: match };
    }

    // Only ASCII whitespace counts as blank, same as GitHub (&nbsp; or full-width space is content)
    function isBlank(text) {
      return !/[^ \t\r\n\f]/.test(text);
    }

    // Any element counts as content, including <br> (the <br> ending the marker line is skipped by the caller)
    function hasContent(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        return !isBlank(node.nodeValue);
      }
      return node.nodeType === Node.ELEMENT_NODE;
    }

    // Move a node keeping its state where moveBefore is supported (e.g. iframes are not reloaded)
    function moveNode(parent, node) {
      if (typeof parent.moveBefore === 'function') {
        parent.moveBefore(node, null);
      } else {
        parent.appendChild(node);
      }
    }

    // Whether the marker is followed by any content before `end` (the next marker paragraph)
    function hasBody(marker, end) {
      const { paragraph, markerNode, lineBreak, match } = marker;
      if (!isBlank(markerNode.nodeValue.slice(match[0].length))) {
        return true;
      }
      for (let node = (lineBreak || markerNode).nextSibling; node; node = node.nextSibling) {
        if (hasContent(node)) {
          return true;
        }
      }
      for (let node = paragraph.nextSibling; node && node !== end; node = node.nextSibling) {
        if (hasContent(node)) {
          return true;
        }
      }
      return false;
    }

    function renderAlert(blockquote, marker) {
      const { paragraph, markerNode, lineBreak, match } = marker;

      // Remove marker and the <br> after it. A newline after the marker is kept (not rendered), so that
      // text extraction such as Hatena's requote gives "Note\nbody" instead of gluing the title to the body
      const rest = markerNode.nodeValue.slice(match[0].length - match[2].length);
      if (rest) {
        markerNode.nodeValue = rest;
      } else {
        markerNode.remove();
      }
      if (lineBreak) {
        lineBreak.remove();
      }

      // Marker-only paragraph ("> [!NOTE]\n>\n> text") leaves an empty paragraph
      if (paragraph.children.length === 0 && isBlank(paragraph.textContent)) {
        paragraph.remove();
      }

      const type = match[1].toLowerCase();
      blockquote.classList.add('markdown-alert', 'markdown-alert-' + type);

      const title = document.createElement('p');
      title.className = 'markdown-alert-title';
      title.textContent = ALERT_TITLES[type];
      blockquote.insertBefore(title, blockquote.firstChild);
    }

    function convertBlockquote(blockquote) {
      const markers = Array.from(blockquote.children).map(findMarker).filter(Boolean);

      // A marker without body stays as plain text (same as GitHub)
      const alerts = markers.filter(function (marker, i) {
        return hasBody(marker, markers[i + 1] ? markers[i + 1].paragraph : null);
      });

      // Hatena Blog merges blockquotes separated by blank lines into one,
      // so split it into one alert per marker paragraph. Walk backwards so each
      // segment only holds the nodes up to the next marker.
      for (let i = alerts.length - 1; i >= 0; i--) {
        const paragraph = alerts[i].paragraph;
        let target = blockquote;

        if (paragraph !== blockquote.firstElementChild) {
          target = blockquote.cloneNode(false);
          target.removeAttribute('id');
          // Insert first: moveBefore keeps node state only when moving within the document
          blockquote.after(target);
          let node = paragraph;
          while (node) {
            const next = node.nextSibling;
            moveNode(target, node);
            node = next;
          }
        }

        renderAlert(target, alerts[i]);
      }
    }

    function convertAlerts(isParsed) {
      // Only top-level blockquotes written in Markdown (no class, unlike embeds such as twitter-tweet) are alerts
      const blockquotes = document.querySelectorAll('.entry-content > blockquote:not([class])');

      blockquotes.forEach(function (blockquote) {
        if (processed.has(blockquote)) {
          return;
        }
        // While loading, skip blockquotes the parser may still be filling (nothing follows them yet)
        if (!isParsed && !blockquote.nextSibling && !blockquote.parentNode.nextSibling) {
          return;
        }
        processed.add(blockquote);
        convertBlockquote(blockquote);
      });
    }

    if (document.readyState === 'loading') {
      // Convert blockquotes as soon as they are parsed, so raw "[!NOTE]" quotes are not painted before DOMContentLoaded
      const observer = new MutationObserver(function () {
        convertAlerts(false);
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
      document.addEventListener('DOMContentLoaded', function () {
        observer.disconnect();
        convertAlerts(true);
      });
    } else {
      convertAlerts(true);
    }
  })();
</script>

<!-- コードブロック機能のJavaScriptコード -->
<script type="text/javascript">
  // このスクリプトはコードブロックのコピー & 折り返し切り替えを実装します
  (function () {
    'use strict';
    document.addEventListener('DOMContentLoaded', function () {
      // Get all code blocks
      const codeBlocks = document.querySelectorAll('pre.code');

      // Add buttons to each code block
      codeBlocks.forEach(function (codeBlock) {
        // Create wrapper for code block
        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';

        // Create copy button
        const copyButton = document.createElement('button');
        copyButton.className = 'code-copy-button';
        copyButton.removeAttribute('title'); // Remove title attribute in initial state
        copyButton.setAttribute('aria-label', 'Copy code');

        // Create wrap toggle button
        const wrapToggleButton = document.createElement('button');
        wrapToggleButton.className = 'code-wrap-toggle';
        wrapToggleButton.title = 'Toggle Wrap';
        wrapToggleButton.setAttribute('aria-label', 'Toggle code wrapping');

        // Move code block from parent to wrapper
        const parent = codeBlock.parentNode;
        parent.insertBefore(wrapper, codeBlock);
        wrapper.appendChild(codeBlock);

        // Initial state is no wrap (default)
        codeBlock.classList.add('nowrap');

        // Add buttons to wrapper (order matters: copy, wrap from right)
        wrapper.appendChild(copyButton);
        wrapper.appendChild(wrapToggleButton);

        // Set click event for copy button
        copyButton.addEventListener('click', function () {
          // Temporarily hide button text before copying
          const originalDisplay = copyButton.style.display;
          copyButton.style.display = 'none';

          // Get text from code block
          const code = codeBlock.textContent;

          // Restore button display
          copyButton.style.display = originalDisplay;

          // Copy to clipboard
          navigator.clipboard.writeText(code).then(function () {
            // Copy succeeded
            copyButton.title = 'Copied';
            copyButton.classList.add('copied');

            // Reset after a certain time
            setTimeout(function () {
              copyButton.removeAttribute('title'); // Remove title attribute
              copyButton.classList.remove('copied');
            }, 2000);
          }).catch(function (err) {
            // Copy failed
            console.error('Copy failed:', err);
            copyButton.title = 'Copy failed';
            copyButton.classList.add('copy-error');

            // Reset after a certain time
            setTimeout(function () {
              copyButton.removeAttribute('title'); // Remove title attribute
              copyButton.classList.remove('copy-error');
            }, 2000);
          });
        });

        // Set click event for wrap toggle button
        wrapToggleButton.addEventListener('click', function () {
          codeBlock.classList.toggle('nowrap');
          codeBlock.classList.toggle('wrap');

          // Update button tooltip
          if (codeBlock.classList.contains('nowrap')) {
            wrapToggleButton.title = 'Enable Wrap';
          } else {
            wrapToggleButton.title = 'Disable Wrap';
          }
        });
      });
    });
  })();
</script>

<!-- ダークモード機能のJavaScriptコード -->
<script>
  // このスクリプトはダークモードボタンを実装します
  (function () {
    // Skip processing if darkModeJs already exists
    if (window.darkModeJs) {
      console.log('Dark mode JS already initialized');
      return;
    }

    // Add attribute to enable dark mode
    document.documentElement.setAttribute('data-enable-dark-mode', 'true');

    // Theme constants
    const THEMES = {
      LIGHT: 'light',
      DARK: 'dark',
      AUTO: 'auto'
    };

    // SVG icon definitions
    const ICONS = {
      SUN: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`,
      MOON: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`,
      MONITOR: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>`,
    };

    // Local storage key
    const STORAGE_KEY = 'codefocus-theme-preference';

    // Get current theme
    function getCurrentTheme() {
      const savedTheme = localStorage.getItem(STORAGE_KEY);
      if (savedTheme && [THEMES.LIGHT, THEMES.DARK, THEMES.AUTO].includes(savedTheme)) {
        return savedTheme;
      }
      return THEMES.AUTO; // Default: match system settings
    }

    // Apply theme
    function applyTheme(theme) {
      if (theme === THEMES.AUTO) {
        // Remove data-theme attribute to match system settings
        document.documentElement.removeAttribute('data-theme');
      } else {
        // Set data-theme attribute for explicit theme
        document.documentElement.setAttribute('data-theme', theme);
      }

      // Save to local storage
      localStorage.setItem(STORAGE_KEY, theme);
    }

    // Get icon corresponding to current theme
    function getIconForTheme(theme) {
      switch (theme) {
        case THEMES.LIGHT:
          return ICONS.SUN;
        case THEMES.DARK:
          return ICONS.MOON;
        case THEMES.AUTO:
        default:
          return ICONS.MONITOR;
      }
    }

    // Create theme switcher button container
    function createThemeSwitcher() {
      // Container element
      const container = document.createElement('div');
      container.className = 'theme-toggle-container';

      // Main button
      const mainButton = document.createElement('button');
      mainButton.className = 'theme-toggle-main';
      mainButton.setAttribute('aria-label', 'Toggle theme');
      mainButton.setAttribute('aria-expanded', 'false');

      // Set icon based on current theme
      const currentIcon = document.createElement('span');
      currentIcon.className = 'current-mode-icon';
      currentIcon.innerHTML = getIconForTheme(getCurrentTheme());
      mainButton.appendChild(currentIcon);

      // Dropdown
      const dropdown = document.createElement('div');
      dropdown.className = 'theme-toggle-dropdown';

      // Dropdown options
      const options = [
        { theme: THEMES.LIGHT, icon: ICONS.SUN, label: 'ライトモード', tooltip: 'ライトモードに固定' },
        { theme: THEMES.DARK, icon: ICONS.MOON, label: 'ダークモード', tooltip: 'ダークモードに固定' },
        { theme: THEMES.AUTO, icon: ICONS.MONITOR, label: '自動切り替え', tooltip: 'システム設定に合わせる' }
      ];

      // Create option buttons
      options.forEach(option => {
        const button = document.createElement('button');
        button.className = 'theme-toggle-option';
        button.setAttribute('aria-label', option.tooltip);
        button.setAttribute('data-theme', option.theme);
        button.title = option.tooltip;

        const iconSpan = document.createElement('span');
        iconSpan.className = 'theme-icon';
        iconSpan.innerHTML = option.icon;
        button.appendChild(iconSpan);

        const labelSpan = document.createElement('span');
        labelSpan.className = 'theme-label';
        labelSpan.textContent = option.label;
        button.appendChild(labelSpan);

        // Add active class if matches current theme
        if (getCurrentTheme() === option.theme) {
          button.classList.add('active');
        }

        // Click event
        button.addEventListener('click', (e) => {
          e.stopPropagation();

          // Apply theme
          applyTheme(option.theme);

          // Close dropdown
          toggleDropdown(false);

          // Update main button icon
          currentIcon.innerHTML = option.icon;

          // Update active state
          dropdown.querySelectorAll('.theme-toggle-option').forEach(btn => {
            btn.classList.remove('active');
          });
          button.classList.add('active');
        });

        dropdown.appendChild(button);
      });

      // Main button click event.
      // Deliberately let the event bubble to document. The outside-click handler below already
      // excludes the container via contains(), so stopping propagation buys nothing here - it
      // only prevents the TOC button script's outside-click handler from closing the floating
      // TOC, leaving both floating panels open on top of each other.
      mainButton.addEventListener('click', () => {
        toggleDropdown();
      });

      // Toggle dropdown visibility
      function toggleDropdown(force) {
        const isVisible = typeof force !== 'undefined' ? force : !dropdown.classList.contains('show');
        dropdown.classList.toggle('show', isVisible);
        mainButton.setAttribute('aria-expanded', isVisible ? 'true' : 'false');
      }

      // Close dropdown on document click
      document.addEventListener('click', (e) => {
        if (!container.contains(e.target)) {
          toggleDropdown(false);
        }
      });

      // Close dropdown on Escape key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && dropdown.classList.contains('show')) {
          toggleDropdown(false);
        }
      });

      // Assemble components
      container.appendChild(mainButton);
      container.appendChild(dropdown);

      return container;
    }

    // Initialization
    function initialize() {
      // Apply current theme
      applyTheme(getCurrentTheme());

      // Add theme switcher UI
      const switcher = createThemeSwitcher();
      document.body.appendChild(switcher);

      // Monitor system color setting changes (to react in auto mode)
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (getCurrentTheme() === THEMES.AUTO) {
          applyTheme(THEMES.AUTO); // Reapply to reflect changes
        }
      });
    }

    // Initialize after DOMContentLoaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initialize);
    } else {
      initialize();
    }

    // Register to global object
    window.darkModeJs = {
      applyTheme,
      getCurrentTheme,
    };
  })();
</script>

<!-- タグクラウド機能のJavaScriptコード -->
<script>
  // タグクラウドの実装 - カテゴリー要素のフォントサイズを記事数に基づいて調整
  (function () {
    // Font size variation range
    const RANGE = 13;

    // Initialization function
    function initCategoryCloud() {
      // Get category list
      const categoryLinks = document.querySelectorAll('.hatena-module-category ul li a');
      if (!categoryLinks.length) return;

      // Extract article count data
      const counts = [];
      categoryLinks.forEach(link => {
        const match = link.textContent.match(/\((\d+)\)/);
        if (match && match[1]) {
          counts.push(parseInt(match[1], 10));
        } else {
          counts.push(0);
        }
      });

      // Calculate minimum and maximum values
      const min = Math.min(...counts);
      const max = Math.max(...counts);

      // Calculate scaling factor based on square root range
      const sqrtMin = Math.sqrt(min);
      const sqrtMax = Math.sqrt(max);
      const factor = RANGE / (sqrtMax - sqrtMin || 1); // Prevent division by zero

      // Apply styles and classes to each category link
      categoryLinks.forEach((link, i) => {
        const count = counts[i];

        // Calculate font size level (for size class)
        const levelRaw = (Math.sqrt(count) - sqrtMin) * factor;
        // Convert to 1-10 scale (enables finer granularity of size changes)
        const sizeClass = Math.max(1, Math.min(10, Math.ceil(levelRaw * 10 / RANGE)));

        // Remove article count in parentheses from text
        const text = link.textContent.trim();
        const cleanText = text.replace(/\s*\(\d+\)\s*$/, '');

        // Apply classes
        link.setAttribute('title', text); // Set original text as tooltip
        link.textContent = cleanText;

        // Add category size class (for CSS styling)
        link.classList.add(`category-size-${sizeClass}`);
        link.parentElement.classList.add('category-cloud-item');
      });

      // Add tag cloud class to parent element
      const categoryContainer = document.querySelector('.hatena-module-category ul');
      if (categoryContainer) {
        categoryContainer.classList.add('category-cloud');
      }
    }

    // Execute after page load completes
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initCategoryCloud);
    } else {
      initCategoryCloud();
    }
  })();
</script>

<script>
  // このスクリプトは目次ボタンと目次表示を実装します
  (function () {
    'use strict';

    // Constants
    const CONSTANTS = {
      WIDE_SCREEN_WIDTH: 1540,      // Minimum width for auto-expand mode
      HEADING_ACTIVE_OFFSET: 100,    // Offset for determining active heading
      RESIZE_DEBOUNCE: 250,          // Debounce time for resize events (ms)
      SCROLL_THROTTLE: 100           // Throttle time for scroll events (ms)
    };

    // Execute after DOM is loaded
    document.addEventListener('DOMContentLoaded', function () {
      // Get all articles with table of contents
      const allEntriesWithToc = Array.from(document.querySelectorAll('.entry-content')).filter(entry =>
        entry.querySelector('.table-of-contents')
      );

      if (allEntriesWithToc.length === 0) return; // Do nothing if no table of contents

      // Create TOC button
      const tocButton = document.createElement('button');
      tocButton.className = 'toc-button';

      // Create element containing TOC text and icon
      const buttonText = document.createElement('span');
      buttonText.className = 'toc-button-text';
      buttonText.textContent = '目次';

      // Create icon element
      const buttonIcon = document.createElement('span');
      buttonIcon.className = 'toc-button-icon';

      // Add elements to button
      tocButton.appendChild(buttonText);
      tocButton.appendChild(buttonIcon);

      // Create floating TOC container
      const floatingToc = document.createElement('div');
      floatingToc.className = 'floating-toc';

      // Create button to scroll to page top
      const topButton = document.createElement('button');
      topButton.className = 'page-top-button';
      topButton.textContent = 'ページトップへ';
      topButton.addEventListener('click', function (e) {
        e.preventDefault();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        // Close TOC
        floatingToc.classList.remove('show');
        tocButton.classList.remove('active');
      });

      // Container for page top button
      const topButtonContainer = document.createElement('div');
      topButtonContainer.className = 'page-top-button-container';
      topButtonContainer.appendChild(topButton);

      // Container for TOC list (will be updated dynamically)
      const tocListContainer = document.createElement('div');
      tocListContainer.className = 'toc-list-container';

      // Add elements to floating TOC
      floatingToc.appendChild(topButtonContainer);
      floatingToc.appendChild(tocListContainer);

      // Add elements to body
      document.body.appendChild(tocButton);
      document.body.appendChild(floatingToc);

      // Set up event delegation for TOC links to prevent memory leaks
      // This handles clicks on all current and future TOC links
      tocListContainer.addEventListener('click', function (e) {
        const link = e.target.closest('a');
        if (link && !isWideScreen()) {
          floatingToc.classList.remove('show');
          tocButton.classList.remove('active');
        }
      });

      // Track current active entry
      let currentActiveEntry = null;
      let currentTocLinks = [];
      let currentHeadingMap = new Map();

      // Function to get the currently visible entry
      function getCurrentVisibleEntry() {
        const viewportCenter = window.innerHeight / 2;

        for (const entry of allEntriesWithToc) {
          const rect = entry.getBoundingClientRect();
          // Check if entry is visible in viewport
          if (rect.top < viewportCenter && rect.bottom > 0) {
            return entry;
          }
        }

        // If no entry is in center, return the first visible one
        for (const entry of allEntriesWithToc) {
          const rect = entry.getBoundingClientRect();
          if (rect.bottom > 0) {
            return entry;
          }
        }

        return allEntriesWithToc[0];
      }

      // Function to update TOC content based on current entry
      function updateTocContent(entry) {
        if (!entry || entry === currentActiveEntry) return;

        currentActiveEntry = entry;

        // Get table of contents for this entry
        const tableOfContents = entry.querySelector('.table-of-contents');
        if (!tableOfContents) return;

        // Clear and update TOC list
        tocListContainer.innerHTML = '';
        const tocClone = tableOfContents.cloneNode(true);
        tocClone.classList = 'floating-toc-list';
        tocListContainer.appendChild(tocClone);

        // Update TOC links
        currentTocLinks = Array.from(floatingToc.querySelectorAll('a'));

        // Update heading map
        currentHeadingMap.clear();
        currentTocLinks.forEach(link => {
          const href = link.getAttribute('href');
          if (href && href.startsWith('#')) {
            const targetId = href.substring(1);
            const targetHeading = document.getElementById(targetId);
            if (targetHeading) {
              currentHeadingMap.set(targetHeading, link);
            }
          }
        });
      }

      // Function to check if screen width is wide enough for auto-expand
      function isWideScreen() {
        return window.innerWidth >= CONSTANTS.WIDE_SCREEN_WIDTH;
      }

      // Function to check if any entry with a table of contents is on screen.
      // The button is only useful while such an entry is in view.
      function isAnyEntryVisible() {
        return allEntriesWithToc.some(entry => {
          const rect = entry.getBoundingClientRect();
          return rect.top < window.innerHeight && rect.bottom > 0;
        });
      }

      // Function to update TOC display based on screen width
      function updateTocDisplay() {
        if (isWideScreen()) {
          // Auto-expand on wide screens
          floatingToc.classList.add('show', 'auto-expanded');
          tocButton.classList.add('active');
          // Hide button on wide screens as TOC is always visible
          tocButton.style.display = 'none';
        } else {
          // Close TOC and remove auto-expand class on smaller screens
          floatingToc.classList.remove('auto-expanded', 'show');
          tocButton.classList.remove('active');
          // Show button on smaller screens.
          // Clear the inline value instead of setting 'block' so the stylesheet keeps control
          // of the layout (display: inline-flex with align-items: center).
          tocButton.style.display = isAnyEntryVisible() ? '' : 'none';
        }
      }

      // Set click event.
      // Deliberately let the event bubble to document. The outside-click handler below already
      // excludes this button and the panel via contains(), so stopping propagation buys nothing
      // here - it only prevents the dark mode script's outside-click handler from closing its
      // dropdown, leaving both floating panels open on top of each other.
      tocButton.addEventListener('click', function (e) {
        e.preventDefault();

        // Don't allow toggle on wide screens (always show)
        if (!isWideScreen()) {
          floatingToc.classList.toggle('show');
          tocButton.classList.toggle('active');
        }
      });

      // Handle window resize
      let resizeTimer;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          updateTocDisplay();
        }, CONSTANTS.RESIZE_DEBOUNCE);
      });

      // Initial check on page load
      updateTocDisplay();

      // Initialize TOC content with first visible entry
      updateTocContent(getCurrentVisibleEntry());

      // Close TOC when clicking outside (except on wide screens)
      document.addEventListener('click', function (event) {
        if (!isWideScreen() && !floatingToc.contains(event.target) && event.target !== tocButton && !tocButton.contains(event.target)) {
          floatingToc.classList.remove('show');
          tocButton.classList.remove('active');
        }
      });

      // Set scroll event with throttling for performance
      let scrollTimer = null;

      window.addEventListener('scroll', function () {
        // Throttle scroll events for performance
        if (scrollTimer !== null) return;

        scrollTimer = setTimeout(function () {
          scrollTimer = null;

          // Get currently visible entry
          const visibleEntry = getCurrentVisibleEntry();

          // Update TOC content if entry changed
          updateTocContent(visibleEntry);

          // Check if any entry with TOC is visible
          const anyEntryVisible = isAnyEntryVisible();

          // Control TOC button visibility based on entry visibility (non-wide screens only)
          // Wide screens: Always visible (controlled by updateTocDisplay())
          if (!isWideScreen()) {
            if (anyEntryVisible) {
              // Clear the inline value so the stylesheet keeps control of the layout
              tocButton.style.display = '';
            } else {
              tocButton.style.display = 'none';
              floatingToc.classList.remove('show'); // Close TOC in non-visible area
              tocButton.classList.remove('active'); // Reset button state
            }
          }

          // Detect and highlight currently visible heading in current entry
          if (currentActiveEntry && anyEntryVisible) {
            // Clear all active classes
            currentTocLinks.forEach(link => {
              link.classList.remove('active');
              // Remove active class from parent li element
              if (link.parentElement) {
                link.parentElement.classList.remove('active');
              }
            });

            // Get headings from current entry only
            const headings = Array.from(currentActiveEntry.querySelectorAll('h1, h2, h3, h4, h5, h6'));

            // Detect currently visible heading
            // Get the heading closest to the top of the screen among visible headings
            let activeHeading = null;
            let minDistance = Infinity;

            headings.forEach(heading => {
              const rect = heading.getBoundingClientRect();
              // Check if element is visible on screen or just above
              if (rect.top <= CONSTANTS.HEADING_ACTIVE_OFFSET) {
                const distance = Math.abs(rect.top);
                if (distance < minDistance) {
                  minDistance = distance;
                  activeHeading = heading;
                }
              }
            });

            // Activate corresponding TOC link
            if (activeHeading && currentHeadingMap.has(activeHeading)) {
              const activeLink = currentHeadingMap.get(activeHeading);
              activeLink.classList.add('active');
              // Add active class to parent li element
              if (activeLink.parentElement) {
                activeLink.parentElement.classList.add('active');
              }

              // Auto-scroll TOC to show active item if it's outside viewport
              // Use 'nearest' to only scroll when necessary
              activeLink.scrollIntoView({
                behavior: 'smooth',
                block: 'nearest',
                inline: 'nearest'
              });
            }
          }
        }, CONSTANTS.SCROLL_THROTTLE);
      });
    });
  })();
</script>

<div class="js-table-of-contents-script"></div>

<!-- 記事中の目次開閉のJavaScriptコード -->
<script>
  // このスクリプトははてなブログ記事内の目次（table-of-contents）の開閉表示を実装します
  (function () {
    'use strict';

    document.addEventListener('DOMContentLoaded', function () {
      // Search for table of contents in article
      const tocElements = document.querySelectorAll('.table-of-contents');

      tocElements.forEach(function (toc) {
        // Skip already processed TOC
        if (toc.classList.contains('toc-processed')) {
          return;
        }

        // Wrap TOC with container
        const tocContainer = document.createElement('div');
        tocContainer.className = 'toc-container';
        toc.parentNode.insertBefore(tocContainer, toc);
        tocContainer.appendChild(toc);

        // Create TOC title
        const tocTitle = document.createElement('div');
        tocTitle.className = 'toc-title';
        tocTitle.innerHTML = '目次 <span class="toc-toggle-icon"></span>';
        tocContainer.insertBefore(tocTitle, toc);

        // Wrap TOC content section with div
        const tocContent = document.createElement('div');
        tocContent.className = 'toc-content';
        tocContent.appendChild(toc.cloneNode(true));
        tocContainer.replaceChild(tocContent, toc);

        // Set state for toggle (default is closed)
        tocContainer.classList.add('toc-closed');

        // Set click event
        tocTitle.addEventListener('click', function () {
          if (tocContainer.classList.contains('toc-open')) {
            // Close if currently open
            tocContainer.classList.remove('toc-open');
            tocContainer.classList.add('toc-closed');
          } else {
            // Open if currently closed
            tocContainer.classList.remove('toc-closed');
            tocContainer.classList.add('toc-open');
          }
        });

        // Mark as processed
        tocContent.querySelector('.table-of-contents').classList.add('toc-processed');
      });
    });
  })();
</script>
