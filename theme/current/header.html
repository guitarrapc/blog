<!-- アラート記法のJavaScriptコード -->
<script>
  // このスクリプトは記事内の引用に書いたGitHubのアラート記法(> [!NOTE] など)をアラート表示に変換します
  /**
   * Script to render GitHub-style alerts (`> [!NOTE]` etc.) in Hatena Blog articles
   */
  (function () {
    'use strict';

    const ALERT_TITLES = {
      note: 'Note',
      tip: 'Tip',
      important: 'Important',
      warning: 'Warning',
      caution: 'Caution',
    };

    // Marker must be alone on its line: "[!NOTE]" followed by newline, <br> or end of paragraph.
    // Only spaces and tabs are allowed around it, same as GitHub (not full-width space or &nbsp;),
    // and it must be on the first line of the paragraph (no newline before it)
    const MARKER_PATTERN = /^[ \t]*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\][ \t]*(\r?\n|$)/i;

    // Blockquotes already handled while the page was loading
    const processed = new WeakSet();

    // Returns marker info if the element is a paragraph starting with an alert marker
    function findMarker(element) {
      if (element.tagName !== 'P') {
        return null;
      }

      const markerNode = element.firstChild;
      if (!markerNode || markerNode.nodeType !== Node.TEXT_NODE) {
        return null;
      }

      const match = markerNode.nodeValue.match(MARKER_PATTERN);
      if (!match) {
        return null;
      }

      // "[!NOTE]" ends at the text node boundary: next must be <br> or nothing (e.g. not "[!NOTE]<strong>")
      const lineBreak = match[2] ? null : markerNode.nextSibling;
      if (lineBreak && lineBreak.nodeName !== 'BR') {
        return null;
      }

      return { paragraph: element, markerNode: markerNode, lineBreak: lineBreak, match: match };
    }

    // Only ASCII whitespace counts as blank, same as GitHub (&nbsp; or full-width space is content)
    function isBlank(text) {
      return !/[^ \t\r\n\f]/.test(text);
    }

    // Any element counts as content, including <br> (the <br> ending the marker line is skipped by the caller)
    function hasContent(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        return !isBlank(node.nodeValue);
      }
      return node.nodeType === Node.ELEMENT_NODE;
    }

    // Move a node keeping its state where moveBefore is supported (e.g. iframes are not reloaded)
    function moveNode(parent, node) {
      if (typeof parent.moveBefore === 'function') {
        parent.moveBefore(node, null);
      } else {
        parent.appendChild(node);
      }
    }

    // Whether the marker is followed by any content before `end` (the next marker paragraph)
    function hasBody(marker, end) {
      const { paragraph, markerNode, lineBreak, match } = marker;
      if (!isBlank(markerNode.nodeValue.slice(match[0].length))) {
        return true;
      }
      for (let node = (lineBreak || markerNode).nextSibling; node; node = node.nextSibling) {
        if (hasContent(node)) {
          return true;
        }
      }
      for (let node = paragraph.nextSibling; node && node !== end; node = node.nextSibling) {
        if (hasContent(node)) {
          return true;
        }
      }
      return false;
    }

    function renderAlert(blockquote, marker) {
      const { paragraph, markerNode, lineBreak, match } = marker;

      // Remove marker and the <br> after it. A newline after the marker is kept (not rendered), so that
      // text extraction such as Hatena's requote gives "Note\nbody" instead of gluing the title to the body
      const rest = markerNode.nodeValue.slice(match[0].length - match[2].length);
      if (rest) {
        markerNode.nodeValue = rest;
      } else {
        markerNode.remove();
      }
      if (lineBreak) {
        lineBreak.remove();
      }

      // Marker-only paragraph ("> [!NOTE]\n>\n> text") leaves an empty paragraph
      if (paragraph.children.length === 0 && isBlank(paragraph.textContent)) {
        paragraph.remove();
      }

      const type = match[1].toLowerCase();
      blockquote.classList.add('markdown-alert', 'markdown-alert-' + type);

      const title = document.createElement('p');
      title.className = 'markdown-alert-title';
      title.textContent = ALERT_TITLES[type];
      blockquote.insertBefore(title, blockquote.firstChild);
    }

    function convertBlockquote(blockquote) {
      const markers = Array.from(blockquote.children).map(findMarker).filter(Boolean);

      // A marker without body stays as plain text (same as GitHub)
      const alerts = markers.filter(function (marker, i) {
        return hasBody(marker, markers[i + 1] ? markers[i + 1].paragraph : null);
      });

      // Hatena Blog merges blockquotes separated by blank lines into one,
      // so split it into one alert per marker paragraph. Walk backwards so each
      // segment only holds the nodes up to the next marker.
      for (let i = alerts.length - 1; i >= 0; i--) {
        const paragraph = alerts[i].paragraph;
        let target = blockquote;

        if (paragraph !== blockquote.firstElementChild) {
          target = blockquote.cloneNode(false);
          target.removeAttribute('id');
          // Insert first: moveBefore throws unless the new parent is in the same document
          blockquote.after(target);
          let node = paragraph;
          while (node) {
            const next = node.nextSibling;
            moveNode(target, node);
            node = next;
          }
        }

        renderAlert(target, alerts[i]);
      }
    }

    function convertAlerts(isParsed) {
      // Only top-level blockquotes written in Markdown (no class, unlike embeds such as twitter-tweet) are alerts
      const blockquotes = document.querySelectorAll('.entry-content > blockquote:not([class])');

      blockquotes.forEach(function (blockquote) {
        if (processed.has(blockquote)) {
          return;
        }
        // While loading, skip blockquotes the parser may still be filling (nothing follows them yet)
        if (!isParsed && !blockquote.nextSibling && !blockquote.parentNode.nextSibling) {
          return;
        }
        processed.add(blockquote);
        convertBlockquote(blockquote);
      });
    }

    if (document.readyState === 'loading') {
      // Convert blockquotes as soon as they are parsed, so raw "[!NOTE]" quotes are not painted before DOMContentLoaded
      const observer = new MutationObserver(function () {
        convertAlerts(false);
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
      document.addEventListener('DOMContentLoaded', function () {
        observer.disconnect();
        convertAlerts(true);
      });
    } else {
      convertAlerts(true);
    }
  })();
</script>

<!-- コードブロック機能のJavaScriptコード -->
<script>
  // このスクリプトは記事内のコードブロックに、折り返しの切り替えボタンとコピーボタンを追加します
  /**
   * Script to add tools (wrap toggle & copy) to Hatena Blog code blocks
   */
  (function () {
    'use strict';

    const LABELS = {
      wrap: 'Wrap',
      copy: 'Copy',
      copied: 'Copied!',
      copyFailed: 'Copy failed',
    };

    // How long the copy result stays on the button
    const RESET_DELAY = 2000;

    function createButton(className, label) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'code-block-button ' + className;
      button.textContent = label;
      return button;
    }

    function enhance(pre) {
      const wrapper = document.createElement('div');
      wrapper.className = 'code-block';

      // The toolbar sits in the header band the theme reserves at the top of every code block,
      // so the buttons never cover the code and adding them does not shift the layout
      const toolbar = document.createElement('div');
      toolbar.className = 'code-block-toolbar';

      const wrapButton = createButton('code-block-wrap', LABELS.wrap);
      wrapButton.setAttribute('aria-pressed', 'false');
      const copyButton = createButton('code-block-copy', LABELS.copy);
      toolbar.append(wrapButton, copyButton);

      // Changing the button text is not announced by screen readers, so report the copy result here
      const status = document.createElement('span');
      status.className = 'code-block-status';
      status.setAttribute('role', 'status');

      pre.before(wrapper);
      wrapper.append(pre, toolbar, status);

      wrapButton.addEventListener('click', function () {
        const wrapped = pre.classList.toggle('is-wrapped');
        wrapButton.setAttribute('aria-pressed', String(wrapped));
      });

      let resetTimer = null;
      function showResult(copied) {
        const label = copied ? LABELS.copied : LABELS.copyFailed;
        copyButton.classList.toggle('is-copied', copied);
        copyButton.classList.toggle('is-failed', !copied);
        copyButton.textContent = label;
        status.textContent = label;

        clearTimeout(resetTimer);
        resetTimer = setTimeout(function () {
          copyButton.classList.remove('is-copied', 'is-failed');
          copyButton.textContent = LABELS.copy;
          status.textContent = '';
        }, RESET_DELAY);
      }

      copyButton.addEventListener('click', function () {
        // The language label is a pseudo element and the buttons are outside <pre>, so this is the code only
        const code = pre.textContent;
        if (!navigator.clipboard) {
          showResult(false);
          return;
        }
        navigator.clipboard.writeText(code).then(function () {
          showResult(true);
        }, function () {
          showResult(false);
        });
      });
    }

    function enhanceAll() {
      // Hatena's ASCII art (pre.lang-aa) is not code
      document.querySelectorAll('.entry-content pre.code:not(.lang-aa)').forEach(function (pre) {
        // Already enhanced (the script may run more than once)
        if (pre.parentElement && pre.parentElement.classList.contains('code-block')) {
          return;
        }
        enhance(pre);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', enhanceAll);
    } else {
      enhanceAll();
    }
  })();
</script>

<!-- ダークモードの切り替え機能のJavaScriptコード -->
<script>
  // このスクリプトは、読者がライト・ダーク・自動(OSの設定)を選べるボタンをブログのヘッダーに置きます。選んだモードはブラウザに記憶します
  // 「設定」→「詳細設定」→「headに要素を追加」に貼り付けると、ページが描かれる前に選んだモードを反映します
  /**
   * Script to let readers choose light, dark, or automatic (OS setting) colors.
   * The theme switches colors with the --swifty-color-mode custom property on <html>;
   * this script sets it from the reader's choice and adds a button to the blog header.
   */
  (function () {
    'use strict';

    const root = document.documentElement;

    // Run once even if the snippet is pasted twice
    if (root.hasAttribute('data-swifty-color-mode-toggle')) {
      return;
    }
    // Tells the theme CSS to keep room for the button in the header from the start, so adding it later does not move the title
    root.setAttribute('data-swifty-color-mode-toggle', '');

    // Remember the reader's choice across pages
    const STORAGE_KEY = 'swifty-color-mode';
    const MODES = ['light', 'dark', 'auto'];

    const ICONS = {
      light: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
      dark: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
      auto: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
    };

    const LABELS = {
      light: 'ライト',
      dark: 'ダーク',
      auto: '自動',
    };

    function storedMode() {
      try {
        const mode = localStorage.getItem(STORAGE_KEY);
        return MODES.indexOf(mode) >= 0 ? mode : 'auto';
      } catch (e) {
        // Storage can be unavailable (e.g. blocked cookies); follow the blog's default
        return 'auto';
      }
    }

    function saveMode(mode) {
      try {
        localStorage.setItem(STORAGE_KEY, mode);
      } catch (e) {
        // Without storage the choice still applies on this page
      }
    }

    // A choice on <html> (inline style) wins over the blog's design CSS. Automatic removes it and
    // falls back to the blog's default: the design CSS setting if any, otherwise the OS setting
    function applyMode(mode) {
      if (mode === 'auto') {
        root.style.removeProperty('--swifty-color-mode');
      } else {
        root.style.setProperty('--swifty-color-mode', mode);
      }
    }

    // Apply before the page is painted (place the snippet in <head> to avoid a flash of the other colors)
    let current = storedMode();
    applyMode(current);

    function createToggle() {
      const container = document.createElement('div');
      container.className = 'color-mode-toggle';

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'color-mode-toggle-button';
      button.setAttribute('aria-expanded', 'false');
      button.setAttribute('aria-controls', 'color-mode-toggle-menu');

      const menu = document.createElement('div');
      menu.className = 'color-mode-toggle-menu';
      menu.id = 'color-mode-toggle-menu';
      menu.hidden = true;

      const options = MODES.map(function (mode) {
        const option = document.createElement('button');
        option.type = 'button';
        option.className = 'color-mode-toggle-option';
        option.setAttribute('data-mode', mode);
        option.innerHTML = ICONS[mode];
        const label = document.createElement('span');
        label.textContent = mode === 'auto' ? '自動(OSの設定)' : LABELS[mode];
        option.appendChild(label);
        option.addEventListener('click', function () {
          current = mode;
          applyMode(mode);
          saveMode(mode);
          update();
          close();
          button.focus();
        });
        menu.appendChild(option);
        return option;
      });

      // Show the current choice on the button and in the menu
      function update() {
        button.innerHTML = ICONS[current];
        button.setAttribute('aria-label', '表示モード: ' + LABELS[current]);
        options.forEach(function (option) {
          option.setAttribute('aria-pressed', String(option.getAttribute('data-mode') === current));
        });
      }

      function open() {
        menu.hidden = false;
        button.setAttribute('aria-expanded', 'true');
      }

      function close() {
        menu.hidden = true;
        button.setAttribute('aria-expanded', 'false');
      }

      button.addEventListener('click', function () {
        if (menu.hidden) {
          open();
        } else {
          close();
        }
      });

      // Close on a click outside, and on Escape (returning focus to the button)
      document.addEventListener('click', function (e) {
        if (!menu.hidden && !container.contains(e.target)) {
          close();
        }
      });
      container.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !menu.hidden) {
          close();
          button.focus();
        }
      });
      // Close when focus leaves the button and the menu
      container.addEventListener('focusout', function (e) {
        if (!menu.hidden && e.relatedTarget && !container.contains(e.relatedTarget)) {
          close();
        }
      });

      update();
      container.append(button, menu);
      return container;
    }

    // Put the button at the end of the blog header as soon as the header is parsed
    // (after the title, so it comes after the title in the tab order)
    function insert() {
      const header = document.getElementById('blog-title');
      const inner = document.getElementById('blog-title-inner');
      const parsed = header && (header.nextElementSibling || document.readyState !== 'loading');
      if (!parsed || !inner) {
        return document.readyState !== 'loading';
      }
      if (!inner.querySelector(':scope > .color-mode-toggle')) {
        inner.appendChild(createToggle());
      }
      return true;
    }

    if (!insert()) {
      const observer = new MutationObserver(function () {
        if (insert()) {
          observer.disconnect();
        }
      });
      observer.observe(root, { childList: true, subtree: true });
      document.addEventListener('DOMContentLoaded', function () {
        observer.disconnect();
        insert();
      });
    }
  })();
</script>

<!-- 目次の開閉機能のJavaScriptコード -->
<script>
  // このスクリプトは記事内の目次を開け閉めできるようにします。閉じたかどうかはブラウザに記憶します
  // 本文の横の長い目次は、いま読んでいる見出しが見える位置まで目次の中をスクロールします
  /**
   * Script to make the table of contents in Hatena Blog articles collapsible,
   * and to keep the heading being read visible in a long table of contents
   */
  (function () {
    'use strict';

    // Remember whether the reader closed the table of contents, across pages
    const STORAGE_KEY = 'swifty-toc-collapsed';

    // Space kept between the current link and the edges of the visible part of the table of contents
    const FOLLOW_MARGIN = 32;

    function isCollapsed() {
      try {
        return localStorage.getItem(STORAGE_KEY) === 'true';
      } catch (e) {
        // Storage can be unavailable (e.g. blocked cookies); start open
        return false;
      }
    }

    function saveCollapsed(collapsed) {
      try {
        localStorage.setItem(STORAGE_KEY, String(collapsed));
      } catch (e) {
        // Without storage the toggle still works on this page
      }
    }

    // Wrap the list Hatena outputs in <details>, so the browser handles opening and closing
    // and tells assistive technology whether it is open. The label text comes from the theme's CSS (--toc-label)
    function enhance(list) {
      const panel = document.createElement('details');
      panel.className = 'toc-panel';
      panel.open = !isCollapsed();

      const summary = document.createElement('summary');
      summary.className = 'toc-panel-summary';
      const label = document.createElement('span');
      label.className = 'toc-panel-label';
      summary.appendChild(label);

      list.before(panel);
      panel.append(summary, list);

      // Setting open above also fires toggle, so save only when the reader changed the remembered state
      panel.addEventListener('toggle', function () {
        if (panel.open === isCollapsed()) {
          saveCollapsed(!panel.open);
        }
      });

      followCurrent(panel, summary);
    }

    // Beside the article, the theme caps the table of contents at the screen height and scrolls it inside.
    // The browser marks the link of the heading being read (:target-current) but does not scroll the
    // table of contents to it, so the mark can be hidden below the visible part. When the page scrolls,
    // scroll only the table of contents (never the page) to bring the current link into view
    function followCurrent(panel, summary) {
      let supported = false;
      try {
        supported = CSS.supports('selector(:target-current)');
      } catch (e) {
        // Without the mark there is nothing to follow
      }
      if (!supported) {
        return;
      }

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let scheduled = false;
      // The link a smooth scroll is heading for, so it is not restarted on every frame
      let following = null;

      function update() {
        scheduled = false;
        // Not open, or not scrolling inside (in the article on narrow screens, or short enough to fit)
        if (!panel.open || panel.scrollHeight <= panel.clientHeight) {
          return;
        }
        const link = panel.querySelector('.table-of-contents a:target-current');
        if (!link || link === following) {
          return;
        }

        // The visible part of the list: below the heading row, and on the screen
        // (at the end of the article the table of contents scrolls up with it)
        const top = Math.max(summary.getBoundingClientRect().bottom, 0) + FOLLOW_MARGIN;
        const bottom = Math.min(panel.getBoundingClientRect().bottom, window.innerHeight) - FOLLOW_MARGIN;
        const rect = link.getBoundingClientRect();
        if (bottom <= top || (rect.top >= top && rect.bottom <= bottom)) {
          return;
        }

        // Put the link in the middle, so the headings before and after it are also visible
        const max = panel.scrollHeight - panel.clientHeight;
        const target = Math.min(max, Math.max(0, panel.scrollTop + (rect.top + rect.bottom) / 2 - (top + bottom) / 2));
        if (Math.abs(target - panel.scrollTop) < 1) {
          return;
        }
        following = link;
        panel.scrollTo({ top: target, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
      }

      // The browser moves the mark while rendering the frame after the scroll (even scrollend still sees the old one),
      // so check on the frame after next
      function schedule() {
        if (!scheduled) {
          scheduled = true;
          requestAnimationFrame(function () {
            requestAnimationFrame(update);
          });
        }
      }

      window.addEventListener('scroll', schedule, { passive: true });
      window.addEventListener('scrollend', schedule);
      window.addEventListener('resize', schedule);
      panel.addEventListener('toggle', schedule);
      // Only forget the link here: checking on the list's own scrollend would pull the list back
      // while the reader scrolls it by hand. The next page scroll brings the current link back
      panel.addEventListener('scrollend', function () {
        following = null;
      });
    }

    function convert() {
      // Only the table of contents placed directly in the article body, the same as the theme's layout
      document.querySelectorAll('.entry-content > ul.table-of-contents').forEach(function (list) {
        enhance(list);
      });
    }

    if (document.readyState === 'loading') {
      // Wrap the list as soon as it is inserted, before its items are parsed: the parser keeps adding items
      // to the moved list, and a remembered closed state is applied before the list is ever painted open
      const observer = new MutationObserver(convert);
      observer.observe(document.documentElement, { childList: true, subtree: true });
      document.addEventListener('DOMContentLoaded', function () {
        observer.disconnect();
        convert();
      });
    } else {
      convert();
    }
  })();
</script>
